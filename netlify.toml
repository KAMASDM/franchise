# Netlify configuration for React SPA deployment

[build]
  # Build command - runs during deployment
  command = "npm run build"

  # Directory to publish - where the built files are located
  publish = "dist"

[build.environment]
  # Vite 7 requires Node 20.19+ / 22.12+
  NODE_VERSION = "22"

  # Enable modern build features and handle peer dependency conflicts
  NPM_FLAGS = "--legacy-peer-deps --production=false"

  # EmailJS Configuration (Public keys - safe to expose)
  VITE_EMAILJS_PUBLIC_KEY = "g8Tjw7vpnhq_5p3hB"
  VITE_EMAILJS_SERVICE_ID = "service_9km8z6q"
  VITE_EMAILJS_TEMPLATE_GENERIC = "template_uhlqmu9"

  # Tell Netlify's secrets scanner to ignore the Google Maps and Gemini keys.
  # These are intentional browser-side keys that must be bundled in the JS output.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# SPA fallback: let React Router handle every path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers for every response. (Headers inside a [[redirects]] block
# are NOT sent to browsers — they must live in [[headers]].)
# No Cache-Control here on purpose: HTML, sw.js and the manifest fall back to
# Netlify's default (max-age=0, must-revalidate) so deploys reach users
# immediately. Only fingerprinted /assets/* are cached forever (below).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(self), payment=()"
    # Report-only first: watch the browser console for CSP violations across
    # the app (maps, auth popups, video embeds, OCR workers), then rename this
    # header to Content-Security-Policy to enforce it.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: blob: data:; media-src 'self' blob: https:; frame-src https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Vite emits content-hashed filenames into /assets, so they never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optional: Preview deployments configuration
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Optional: Development server settings for Netlify Dev
[dev]
  command = "npm run dev"
  port = 5173
  publish = "dist"
